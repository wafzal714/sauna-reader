# Deploy to Azure
#
# Required GitHub secrets / variables:
#   AZURE_CLIENT_ID       - Service principal / managed identity client ID
#   AZURE_TENANT_ID       - Azure Active Directory tenant ID
#   AZURE_SUBSCRIPTION_ID - Azure subscription ID
#   AZURE_RG              - Name of the pre-created resource group to deploy into
#
# To create the secrets, follow the OIDC federation guide:
# https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect
#
# Optionally, add the following variables (with defaults shown):
#   APP_NAME    - Base name for Azure resources (default: sauna-reader)
#   SKU_NAME    - App Service Plan SKU          (default: B1)

name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write  # required for OIDC login
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: test
    outputs:
      webAppName: ${{ steps.bicep.outputs.webAppName }}
      webAppUrl: ${{ steps.bicep.outputs.webAppUrl }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RG }}
          template: infra/main.bicep
          parameters: >
            infra/main.bicepparam.json
            appName=${{ vars.APP_NAME || 'sauna-reader' }}
            skuName=${{ vars.SKU_NAME || 'B1' }}

  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy app to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy-infra.outputs.webAppName }}
          package: .
